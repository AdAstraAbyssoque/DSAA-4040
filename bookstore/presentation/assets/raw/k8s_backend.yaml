apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: bookstore
spec:
  replicas: 2
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
      - name: backend
        image: bookstore-backend:latest
        ports: [{ containerPort: 8000 }]
        envFrom:
        - configMapRef: { name: bookstore-config }   # DB_HOST, REDIS_HOST
        - secretRef:    { name: bookstore-secret }   # DB_USER, DB_PASSWORD
        readinessProbe:
          httpGet: { path: /api/health, port: 8000 }
        livenessProbe:
          httpGet: { path: /api/health, port: 8000 }
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits:   { cpu: 500m, memory: 256Mi }
