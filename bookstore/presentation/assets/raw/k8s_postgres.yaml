apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: postgres-pvc, namespace: bookstore }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres, namespace: bookstore }
spec:
  serviceName: postgres-service
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports: [{ containerPort: 5432 }]
        env:
        - { name: POSTGRES_DB,       valueFrom: { configMapKeyRef: { name: bookstore-config, key: DB_NAME } } }
        - { name: POSTGRES_USER,     valueFrom: { secretKeyRef:    { name: bookstore-secret, key: DB_USER } } }
        - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef:    { name: bookstore-secret, key: DB_PASSWORD } } }
        volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
        readinessProbe:
          exec: { command: ["pg_isready","-U","bookstore"] }
      volumes:
      - { name: data, persistentVolumeClaim: { claimName: postgres-pvc } }
